name: Carrick Therapeutics
description: 'Carrick Therapeutics is a clinical-stage biopharmaceutical company headquartered
  in Boston, Massachusetts, developing novel oncology therapies aimed at improving outcomes
  for patients with aggressive and treatment-resistant cancers. Its pipeline centers on
  transcriptional CDK inhibition, led by samuraciclib (a CDK7 inhibitor in Phase 2) and
  CT7439 (a CDK12/13 inhibitor in Phase 1), pursued as combination therapies across advanced
  hormone-receptor-positive/HER2-negative breast cancer, prostate cancer, ovarian cancer,
  and additional indications. The company is backed by GV (Google Ventures) and was added
  to the API Evangelist network as a life-sciences company profile; it publishes no developer
  API, SDK, or documentation surface at this time.'
